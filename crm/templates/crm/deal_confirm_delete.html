{% extends "_app_layout.html" %}

{% block title %}Delete {{ object.name }}?{% endblock %}

{% block content %}
<div class="max-w-xl">
  <p class="text-sm opacity-60 mb-1">
    <a href="{% url 'crm:deal_list' %}" class="link link-hover">Deals</a> /
    <a href="{{ object.get_absolute_url }}" class="link link-hover">{{ object.name }}</a>
  </p>
  <h1 class="text-2xl font-semibold mb-6">Delete deal</h1>

  <div class="card bg-base-100 shadow">
    <div class="card-body">
      <p>Are you sure you want to delete <strong>{{ object.name }}</strong>? This cannot be undone.</p>

      <form method="post" class="card-actions justify-end mt-2">
        {% csrf_token %}
        <a href="{{ object.get_absolute_url }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-error">Delete</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
