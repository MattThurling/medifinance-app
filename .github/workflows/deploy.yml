name: Deploy

# develop -> medifinance-dev, main -> medifinance-prod
on:
  push:
    branches: [main, develop]

env:
  REGION: europe-west2
  AR_REPO: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "service=medifinance-prod" >> "$GITHUB_OUTPUT"
            echo "suffix=prod"             >> "$GITHUB_OUTPUT"
          else
            echo "service=medifinance-dev"  >> "$GITHUB_OUTPUT"
            echo "suffix=dev"              >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/medifinance:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run migrations (Cloud Run Job)
        run: |
          SUFFIX="${{ steps.target.outputs.suffix }}"
          gcloud run jobs deploy "migrate-${SUFFIX}" \
            --image "$IMAGE" \
            --region "$REGION" \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_CONNECTION }}" \
            --set-secrets "DJANGO_SECRET_KEY=django-secret-${SUFFIX}:latest,DATABASE_URL=database-url-${SUFFIX}:latest" \
            --set-env-vars "DJANGO_DEBUG=0" \
            --command python \
            --args manage.py,migrate
          gcloud run jobs execute "migrate-${SUFFIX}" --region "$REGION" --wait

      - name: Deploy service (Cloud Run)
        run: |
          SUFFIX="${{ steps.target.outputs.suffix }}"

          SECRETS="DJANGO_SECRET_KEY=django-secret-${SUFFIX}:latest,DATABASE_URL=database-url-${SUFFIX}:latest"
          ENVVARS="DJANGO_DEBUG=0|DJANGO_ALLOWED_HOSTS=.run.app|DJANGO_CSRF_TRUSTED_ORIGINS=https://*.run.app|HUBSPOT_PORTAL_ID=3378161"

          # Email via the medi-finance.co.uk SMTP server when EMAIL_ENABLED=true.
          # Settings already encodes EMAIL_HOST / PORT / USE_SSL / USER as defaults,
          # so only the password (from Secret Manager) is required here. Without it,
          # the app falls back to the console backend (emails -> Cloud Run logs).
          if [ "${{ vars.EMAIL_ENABLED }}" = "true" ]; then
            SECRETS="${SECRETS},EMAIL_HOST_PASSWORD=email-host-password:latest"
          fi

          # Uploaded documents go to a private GCS bucket when GS_BUCKET_NAME is set;
          # otherwise they'd land on the container filesystem and vanish on restart.
          if [ -n "${{ vars.GS_BUCKET_NAME }}" ]; then
            ENVVARS="${ENVVARS}|GS_BUCKET_NAME=${{ vars.GS_BUCKET_NAME }}"
          fi

          gcloud run deploy "${{ steps.target.outputs.service }}" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_CONNECTION }}" \
            --set-secrets "$SECRETS" \
            --set-env-vars "^|^${ENVVARS}"
