name: CI/CD

# Test on every push and PR; deploy on push to main/develop only.
# develop -> medifinance-dev, main -> medifinance-prod
on:
  push:
    branches: [main, develop]
  pull_request:

env:
  REGION: europe-west2
  AR_REPO: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # The `{% icon %}` templatetag reads SVGs from node_modules/lucide-static
      # at render time, so the smoke tests need it on disk.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install lucide-static (for the {% icon %} templatetag)
        run: npm ci

      - name: Run test suite
        run: python manage.py test --verbosity=2

  deploy:
    needs: test
    # Only deploy on push to main/develop — not on PR builds.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "service=medifinance-prod" >> "$GITHUB_OUTPUT"
            echo "suffix=prod"             >> "$GITHUB_OUTPUT"
          else
            echo "service=medifinance-dev"  >> "$GITHUB_OUTPUT"
            echo "suffix=dev"              >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/medifinance:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run migrations (Cloud Run Job)
        run: |
          SUFFIX="${{ steps.target.outputs.suffix }}"
          gcloud run jobs deploy "migrate-${SUFFIX}" \
            --image "$IMAGE" \
            --region "$REGION" \
            --set-cloudsql-instances "${{ vars.CLOUDSQL_CONNECTION }}" \
            --set-secrets "DJANGO_SECRET_KEY=django-secret-${SUFFIX}:latest,DATABASE_URL=database-url-${SUFFIX}:latest" \
            --set-env-vars "DJANGO_DEBUG=0" \
            --command python \
            --args manage.py,migrate
          gcloud run jobs execute "migrate-${SUFFIX}" --region "$REGION" --wait

      - name: Deploy service (Cloud Run)
        run: |
          SUFFIX="${{ steps.target.outputs.suffix }}"

          SECRETS="DJANGO_SECRET_KEY=django-secret-${SUFFIX}:latest,DATABASE_URL=database-url-${SUFFIX}:latest"
          ENVVARS="DJANGO_DEBUG=0|DJANGO_ALLOWED_HOSTS=.run.app|DJANGO_CSRF_TRUSTED_ORIGINS=https://*.run.app|HUBSPOT_PORTAL_ID=3378161"

          # Email via the medi-finance.co.uk SMTP server when EMAIL_ENABLED=true.
          # Settings already encodes EMAIL_HOST / PORT / USE_SSL / USER as defaults,
          # so only the password (from Secret Manager) is required here. Without it,
          # the app falls back to the console backend (emails -> Cloud Run logs).
          if [ "${{ vars.EMAIL_ENABLED }}" = "true" ]; then
            SECRETS="${SECRETS},EMAIL_HOST_PASSWORD=email-host-password:latest"
          fi

          # Xero integration — Connect button + invoice-raising flow. Both
          # credentials must be in Secret Manager when XERO_ENABLED=true; the
          # Xero status page renders a 'not configured' warning otherwise.
          if [ "${{ vars.XERO_ENABLED }}" = "true" ]; then
            SECRETS="${SECRETS},XERO_CLIENT_ID=xero-client-id:latest,XERO_CLIENT_SECRET=xero-client-secret:latest"
          fi

          # Uploaded documents go to a private GCS bucket when GS_BUCKET_NAME is set;
          # otherwise they'd land on the container filesystem and vanish on restart.
          if [ -n "${{ vars.GS_BUCKET_NAME }}" ]; then
            ENVVARS="${ENVVARS}|GS_BUCKET_NAME=${{ vars.GS_BUCKET_NAME }}"
          fi

          # Staff addresses notified about new API-created deals (comma-separated).
          # Override with the NOTIFY_EMAILS repo variable; default matches settings.py.
          ENVVARS="${ENVVARS}|NOTIFY_EMAILS=${{ vars.NOTIFY_EMAILS || 'mnthurling@gmail.com' }}"

          gcloud run deploy "${{ steps.target.outputs.service }}" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_CONNECTION }}" \
            --set-secrets "$SECRETS" \
            --set-env-vars "^|^${ENVVARS}"
