{% comment %}
Shared shell for transactional HTML emails. The logo is attached inline by
accounts.emails._build_message and referenced by Content-ID, so it renders
without the recipient's client fetching anything from our server.
{% endcomment %}<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /></head>
<body style="margin:0; padding:0; background:#f3f4f6; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background:#ffffff; border-radius:12px; overflow:hidden;">
          <tr>
            <td style="padding:24px 32px; border-bottom:1px solid #e5e7eb;">
              <img src="cid:medifinance-logo" width="180" height="33" alt="Medifinance"
                   style="display:block; width:180px; height:33px; border:0; outline:none; text-decoration:none;" />
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
{% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px; background:#f9fafb; color:#6b7280; font-size:12px; text-align:center;">
              Medifinance
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
